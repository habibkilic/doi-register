<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol - Akademik Dergi Portalı</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 min-h-screen text-slate-100 flex items-center justify-center p-4 font-sans relative overflow-hidden">

    <div class="absolute -top-40 -right-40 w-96 h-96 bg-emerald-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-40 -left-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-md relative z-10 space-y-6">
        
        <div class="text-center space-y-2">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-emerald-500 to-sky-600 flex items-center justify-center mx-auto shadow-xl shadow-emerald-500/20">
                <i class="fa-solid fa-user-plus text-white text-2xl"></i>
            </div>
            <h1 class="text-2xl font-black tracking-tight text-white">AKADEMİK <span class="text-emerald-400">HESAP</span></h1>
            <p class="text-xs text-slate-400">Ücretsiz Kayıt Olun, Anında 10 DOI Kredisi Kazanın</p>
        </div>

        <div class="bg-slate-800/90 backdrop-blur-xl border border-slate-700/80 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6">
            
            <div class="border-b border-slate-700/60 pb-3 flex justify-between items-center">
                <h2 class="text-base font-bold text-white">Yeni Akademisyen Kaydı</h2>
                <a href="/login" class="text-xs font-semibold text-sky-400 hover:text-sky-300 transition">
                    &larr; Giriş Yap
                </a>
            </div>

            {% if error_message %}
            <div class="p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs flex items-center space-x-2">
                <i class="fa-solid fa-circle-exclamation text-rose-400 shrink-0"></i>
                <span>{{ error_message }}</span>
            </div>
            {% endif %}

            <form action="/register" method="post" class="space-y-4">
                
                <div class="grid grid-cols-3 gap-2">
                    <div>
                        <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">Unvan</label>
                        <select name="academic_title" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-2 py-2.5 text-xs text-white focus:outline-none focus:ring-2 focus:ring-emerald-500">
                            <option value="Prof. Dr.">Prof. Dr.</option>
                            <option value="Doç. Dr.">Doç. Dr.</option>
                            <option value="Dr. Öğr. Üyesi" selected>Dr. Öğr. Üyesi</option>
                            <option value="Arş. Gör.">Arş. Gör.</option>
                            <option value="Öğr. Gör.">Öğr. Gör.</option>
                            <option value="Araştırmacı">Araştırmacı</option>
                        </select>
                    </div>
                    <div class="col-span-2">
                        <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">Ad Soyad</label>
                        <input type="text" name="name" required placeholder="Adınız Soyadınız" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">Üniversite / Kurum</label>
                    <input type="text" name="institution" required placeholder="Örn: İstanbul Teknik Üniversitesi" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">E-Posta Adresi</label>
                    <input type="email" name="email" required placeholder="ad.soyad@universite.edu.tr" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1">Şifre Belirleyin</label>
                    <input type="password" name="password" required placeholder="En az 3 karakter" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>

                <div class="bg-emerald-500/10 border border-emerald-500/30 rounded-xl p-3 text-[11px] text-emerald-300 flex items-center space-x-2">
                    <i class="fa-solid fa-gift text-emerald-400 text-sm"></i>
                    <span>Tebrikler! Kayıt olduğunuzda hesabınıza <strong>10 Ücretsiz DOI Kredisi</strong> tanımlanacaktır.</span>
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold py-2.5 px-4 rounded-xl text-xs shadow-lg shadow-emerald-500/20 transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-user-check"></i>
                    <span>Kayıt Ol ve Giriş Yap</span>
                </button>
            </form>

        </div>

        <div class="text-center text-xs text-slate-500">
            <span>Zaten hesabınız var mı?</span>
            <a href="/login" class="text-sky-400 hover:underline font-bold ml-1">Giriş Yapın</a>
        </div>

    </div>

</body>
</html>
