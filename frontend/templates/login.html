<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - Akademik Dergi Portalı</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#1e3a8a',
                        secondary: '#0284c7',
                        accent: '#0d9488'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 min-h-screen text-slate-100 flex items-center justify-center p-4 font-sans relative overflow-hidden">

    <!-- ARKA PLAN EFEKTLERİ -->
    <div class="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-sky-600/20 rounded-full blur-3xl pointer-events-none"></div>

    <div class="w-full max-w-md relative z-10 space-y-6">
        
        <!-- LOGO & BAŞLIK -->
        <div class="text-center space-y-2">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center mx-auto shadow-xl shadow-indigo-500/20">
                <i class="fa-solid fa-graduation-cap text-white text-2xl"></i>
            </div>
            <h1 class="text-2xl font-black tracking-tight text-white">AKADEMİK <span class="text-sky-400">DERGİ</span></h1>
            <p class="text-xs text-slate-400">İndeks Denetim, NLP & DOI Yönetim Portalı</p>
        </div>

        <!-- GİRİŞ KARTI -->
        <div class="bg-slate-800/90 backdrop-blur-xl border border-slate-700/80 rounded-3xl p-6 sm:p-8 shadow-2xl space-y-6">
            
            <div class="border-b border-slate-700/60 pb-3 flex justify-between items-center">
                <h2 class="text-base font-bold text-white">Akademisyen Girişi</h2>
                <a href="/register" class="text-xs font-semibold text-sky-400 hover:text-sky-300 transition">
                    Hesap Aç &rarr;
                </a>
            </div>

            <!-- HATA MESAJI -->
            {% if error_message %}
            <div class="p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-300 text-xs flex items-center space-x-2">
                <i class="fa-solid fa-circle-exclamation text-rose-400 shrink-0"></i>
                <span>{{ error_message }}</span>
            </div>
            {% endif %}

            <!-- FORM -->
            <form action="/login" method="post" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">E-Posta Adresi</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 text-xs">
                            <i class="fa-solid fa-envelope"></i>
                        </span>
                        <input type="email" name="email" id="login-email" required placeholder="ornek@universite.edu.tr" value="editor@akademikdergi.com" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl pl-9 pr-4 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition">
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-1.5">
                        <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider">Şifre</label>
                        <span class="text-[11px] text-slate-500">Demo Şifre: 123</span>
                    </div>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400 text-xs">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" name="password" id="login-password" required placeholder="••••••••" value="123" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl pl-9 pr-10 py-2.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 focus:border-transparent transition">
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-200 text-xs">
                            <i class="fa-solid fa-eye" id="pwd-icon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-600 hover:to-indigo-700 text-white font-bold py-2.5 px-4 rounded-xl text-xs shadow-lg shadow-sky-500/20 transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span>Güvenli Giriş Yap</span>
                </button>
            </form>

            <!-- HIZLI DEMO HESAP SEÇİCİLER (HOCAYA SUNUMDA ÇOK KOLAYLIK SAĞLAR) -->
            <div class="pt-4 border-t border-slate-700/60 space-y-2">
                <div class="text-[11px] font-bold text-slate-400 text-center uppercase tracking-wider">Hızlı Demo Girişi (1 Tıkla)</div>
                <div class="grid grid-cols-2 gap-2">
                    <button type="button" onclick="fillDemoAccount('editor@akademikdergi.com', '123')" class="bg-slate-900/80 hover:bg-slate-900 border border-slate-700 hover:border-sky-500/50 p-2 rounded-xl text-left transition text-xs group">
                        <div class="font-bold text-sky-400 group-hover:text-sky-300">Prof. Dr. Editör</div>
                        <div class="text-[10px] text-slate-500 truncate">editor@akademikdergi.com</div>
                    </button>
                    <button type="button" onclick="fillDemoAccount('yazar@akademikdergi.com', '123')" class="bg-slate-900/80 hover:bg-slate-900 border border-slate-700 hover:border-emerald-500/50 p-2 rounded-xl text-left transition text-xs group">
                        <div class="font-bold text-emerald-400 group-hover:text-emerald-300">Doç. Dr. Yazar</div>
                        <div class="text-[10px] text-slate-500 truncate">yazar@akademikdergi.com</div>
                    </button>
                </div>
            </div>

        </div>

        <!-- ALT BİLGİ -->
        <div class="text-center text-xs text-slate-500">
            <span>Hesabınız yok mu?</span>
            <a href="/register" class="text-sky-400 hover:underline font-bold ml-1">Ücretsiz Kayıt Olun (+10 Hediye DOI Kredisi)</a>
        </div>

    </div>

    <script>
    function togglePasswordVisibility() {
        const pwdInput = document.getElementById('login-password');
        const icon = document.getElementById('pwd-icon');
        if (pwdInput.type === 'password') {
            pwdInput.type = 'text';
            icon.className = 'fa-solid fa-eye-slash';
        } else {
            pwdInput.type = 'password';
            icon.className = 'fa-solid fa-eye';
        }
    }

    function fillDemoAccount(email, password) {
        document.getElementById('login-email').value = email;
        document.getElementById('login-password').value = password;
    }
    </script>
</body>
</html>
